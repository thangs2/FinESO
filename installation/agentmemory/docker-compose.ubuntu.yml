# Ubuntu overlay — extends the default stack with Linux-friendly options.
# Usage: AGENTMEMORY_COMPOSE_FILE=docker-compose.ubuntu.yml ./agentmemory-docker-ubuntu.sh start
name: ${AGENTMEMORY_COMPOSE_PROJECT:-fineso-agentmemory}

services:
  agentmemory:
    container_name: ${AGENTMEMORY_CONTAINER_NAME:-fineso-agentmemory}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        III_VERSION: ${AGENTMEMORY_III_VERSION:-0.11.2}
        AGENTMEMORY_VERSION: ${AGENTMEMORY_WORKER_VERSION:-0.9.12}
        III_SDK_VERSION: ${AGENTMEMORY_III_VERSION:-0.11.2}
    init: true
    ports:
      - "127.0.0.1:${AGENTMEMORY_HOST_API_PORT:-3311}:3111"
      - "127.0.0.1:${AGENTMEMORY_HOST_STREAM_PORT:-3312}:3112"
      - "127.0.0.1:${AGENTMEMORY_HOST_VIEWER_PORT:-3313}:3113"
      - "127.0.0.1:${AGENTMEMORY_HOST_WS_PORT:-49334}:49134"
      - "127.0.0.1:${AGENTMEMORY_HOST_METRICS_PORT:-9664}:9464"
    volumes:
      - ${AGENTMEMORY_DATA_DIR:-../../data.agentmemory}:/data
    environment:
      AGENTMEMORY_DATA_DIR: /data
      AGENTMEMORY_VIEWER_HOST: "0.0.0.0"
      GRAPH_EXTRACTION_ENABLED: "true"
      AGENTMEMORY_HOST_API_PORT: ${AGENTMEMORY_HOST_API_PORT:-3311}
      AGENTMEMORY_HOST_VIEWER_PORT: ${AGENTMEMORY_HOST_VIEWER_PORT:-3313}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
